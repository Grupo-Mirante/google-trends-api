services:
  app:
    build: .
    container_name: trends_app
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src

  redis:
    image: redis:7
    container_name: trends_redis
    ports:
      - "6379:6379"
